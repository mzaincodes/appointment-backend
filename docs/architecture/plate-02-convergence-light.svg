<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="330" viewBox="0 0 1160 330" role="img"
           aria-label="The booking form calls POST /api/appointments and the chatbot's create_appointment tool calls the same appointmentService.create function, so both paths share one set of rules and one database constraint.">
<style>
  svg { background: #FFFFFF; }
  .box      { fill: #FFFFFF; stroke: #D3DDDB; stroke-width: 1.25; }
  .box-soft { fill: #F1F4F3; stroke: #E4EBEA; stroke-width: 1; }
  .box-key  { fill: #E2F1EF; stroke: #9FCFC9; stroke-width: 1.5; }
  .box-warn { fill: #FBEEDC; stroke: #E5BE8A; stroke-width: 1.5; }
  .tier     { fill: none; stroke: #D3DDDB; stroke-width: 1; stroke-dasharray: 3 5; }

  .t       { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #0D1417; font-size: 13.5px; }
  .t-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #0D1417; font-size: 14.5px; font-weight: 700; }
  .t-sm    { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #5A6B70; font-size: 10.5px; letter-spacing: .04em; }
  .t-tier  { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #5A6B70; font-size: 10px; letter-spacing: .18em; }
  .t-key   { fill: #0F766E; }
  .t-warn  { fill: #A8560A; }

  .wire       { fill: none; stroke: #3D4F53; stroke-width: 1.6; opacity: .55; }
  .wire-key   { fill: none; stroke: #0F766E; stroke-width: 2.2; }
  .wire-warn  { fill: none; stroke: #A8560A; stroke-width: 2; }
  .wire-dash  { stroke-dasharray: 7 6; }
  .wire-block { fill: none; stroke: #A8560A; stroke-width: 2; stroke-dasharray: 5 5; opacity: .9; }

  .mk      { fill: #3D4F53; opacity: .7; }
  .mk-key  { fill: #0F766E; }
  .mk-warn { fill: #A8560A; }

  /* The motion: dashes travel along each wire in the direction of the flow. */
  .flow { stroke-dasharray: 5 11; animation: travel 1.25s linear infinite; }
  @keyframes travel { to { stroke-dashoffset: -32; } }

  .pulse { fill: #0F766E; animation: breathe 3.2s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .3; } 50% { opacity: .95; } }

  @media (prefers-reduced-motion: reduce) {
    .flow  { animation: none; }
    .pulse { animation: none; opacity: .6; }
  }
  .rule-warn { stroke: #E5BE8A; }
  .rule-plain { stroke: #D3DDDB; }
</style>
        <defs>
          <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" class="mk-key"/>
          </marker>
        </defs>
        <rect class="box-key" x="48" y="60" width="228" height="72" rx="2"/>
        <text class="t-title" x="66" y="90">Booking form</text>
        <text class="t-sm"    x="66" y="112">POST /api/appointments</text>
        <rect class="box-key" x="48" y="196" width="228" height="72" rx="2"/>
        <text class="t-title" x="66" y="226">Chatbot</text>
        <text class="t-sm"    x="66" y="248">create_appointment tool</text>
        <path class="wire-key flow" marker-end="url(#ar2)" d="M 276 96 C 350 96, 360 152, 428 152"/>
        <path class="wire-key flow" marker-end="url(#ar2)" d="M 276 232 C 350 232, 360 178, 428 178"/>
        <rect class="box-key" x="432" y="120" width="286" height="90" rx="2"/>
        <text class="t-title t-key" x="452" y="150">appointmentService.create()</text>
        <text class="t-sm" x="452" y="172">prefill · validate · check availability</text>
        <text class="t-sm" x="452" y="190">insert inside a transaction</text>
        <path class="wire-warn flow" marker-end="url(#ar2)" d="M 718 165 L 856 165"/>
        <text class="t-sm" x="750" y="152">one row</text>
        <rect class="box-warn" x="860" y="120" width="252" height="90" rx="2"/>
        <text class="t-title t-warn" x="880" y="150">appointments</text>
        <text class="t-sm t-warn"    x="880" y="174">EXCLUDE USING gist</text>
        <text class="t-sm"           x="880" y="192">overlap is impossible</text>
        <text class="t-sm" x="432" y="252">Same validation. Same availability engine. Same transaction. Same constraint.</text>
        <text class="t-sm t-key" x="432" y="272">There is no second booking path to keep in sync.</text>
      </svg>