<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="330" viewBox="0 0 1160 330" role="img"
           aria-label="The language model only chooses tool names and arguments. Tools validate arguments and delegate to services, which own the rules and reach the database. The model itself never crosses into the data layer.">
<style>
  svg { background: #101A1D; }
  .box      { fill: #101A1D; stroke: #26383C; stroke-width: 1.25; }
  .box-soft { fill: #080D0F; stroke: #1A282B; stroke-width: 1; }
  .box-key  { fill: #0E2C2B; stroke: #1E6E67; stroke-width: 1.5; }
  .box-warn { fill: #2E2109; stroke: #7A5518; stroke-width: 1.5; }
  .tier     { fill: none; stroke: #26383C; stroke-width: 1; stroke-dasharray: 3 5; }

  .t       { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #E7EFEE; font-size: 13.5px; }
  .t-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #E7EFEE; font-size: 14.5px; font-weight: 700; }
  .t-sm    { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #7E9694; font-size: 10.5px; letter-spacing: .04em; }
  .t-tier  { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #7E9694; font-size: 10px; letter-spacing: .18em; }
  .t-key   { fill: #2DD4BF; }
  .t-warn  { fill: #F0B45E; }

  .wire       { fill: none; stroke: #A9BEBC; stroke-width: 1.6; opacity: .55; }
  .wire-key   { fill: none; stroke: #2DD4BF; stroke-width: 2.2; }
  .wire-warn  { fill: none; stroke: #F0B45E; stroke-width: 2; }
  .wire-dash  { stroke-dasharray: 7 6; }
  .wire-block { fill: none; stroke: #F0B45E; stroke-width: 2; stroke-dasharray: 5 5; opacity: .9; }

  .mk      { fill: #A9BEBC; opacity: .7; }
  .mk-key  { fill: #2DD4BF; }
  .mk-warn { fill: #F0B45E; }

  /* The motion: dashes travel along each wire in the direction of the flow. */
  .flow { stroke-dasharray: 5 11; animation: travel 1.25s linear infinite; }
  @keyframes travel { to { stroke-dashoffset: -32; } }

  .pulse { fill: #2DD4BF; animation: breathe 3.2s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .3; } 50% { opacity: .95; } }

  @media (prefers-reduced-motion: reduce) {
    .flow  { animation: none; }
    .pulse { animation: none; opacity: .6; }
  }
  .rule-warn { stroke: #7A5518; }
  .rule-plain { stroke: #26383C; }
</style>
        <defs>
          <marker id="ar4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" class="mk-key"/>
          </marker>
        </defs>
        <rect class="box" x="48" y="80" width="212" height="110" rx="2"/>
        <text class="t-title" x="66" y="110">Mistral</text>
        <text class="t-sm" x="66" y="134">picks a tool name</text>
        <text class="t-sm" x="66" y="150">and arguments</text>
        <text class="t-sm" x="66" y="172">nothing else</text>
        <path class="wire-key flow" marker-end="url(#ar4)" d="M 260 135 L 336 135"/>
        <rect class="box-key" x="340" y="72" width="236" height="126" rx="2"/>
        <text class="t-title t-key" x="358" y="100">tool layer</text>
        <text class="t-sm" x="358" y="124">Zod-validates arguments</text>
        <text class="t-sm" x="358" y="142">resolves "tomorrow"</text>
        <text class="t-sm" x="358" y="160">into a real date</text>
        <text class="t-sm" x="358" y="182">returns errors as data</text>
        <path class="wire-key flow" marker-end="url(#ar4)" d="M 576 135 L 652 135"/>
        <rect class="box-key" x="656" y="72" width="212" height="126" rx="2"/>
        <text class="t-title t-key" x="674" y="100">services</text>
        <text class="t-sm" x="674" y="124">availability</text>
        <text class="t-sm" x="674" y="142">ownership</text>
        <text class="t-sm" x="674" y="160">status transitions</text>
        <text class="t-sm" x="674" y="182">the actual rules</text>
        <path class="wire-warn flow" marker-end="url(#ar4)" d="M 868 135 L 940 135"/>
        <rect class="box-warn" x="944" y="88" width="168" height="94" rx="2"/>
        <text class="t-title t-warn" x="962" y="118">PostgreSQL</text>
        <text class="t-sm" x="962" y="142">constraints have</text>
        <text class="t-sm" x="962" y="158">the last word</text>
        <path class="wire-block" d="M 300 232 L 1112 232"/>
        <text class="t-sm t-warn" x="300" y="256">the model never reaches past this line</text>
        <path class="wire-block" d="M 154 200 C 154 232, 154 232, 300 232" opacity=".45"/>
        <text class="t-sm" x="48" y="292">Clinic facts come from retrieval, never memory: a full-text query over</text>
        <text class="t-sm" x="48" y="308">clinic_knowledge, blended with trigram similarity for typos. No vector store.</text>
      </svg>